name: terraform setup
description: Install terraform

inputs:
  terraform_version:
    description: "A specific version of Terraform CLI can be installed"
    required: false
    default: "" 

  cli_config_credentials_token:
    description: Terraform Cloud API token
    required: false
    default: ""

runs:
  using: composite
  steps:
    # SRC: https://github.com/hashicorp/setup-terraform/releases/tag/v4.0.1
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      with:
        terraform_version: ${{ inputs.terraform_version }}
        cli_config_credentials_token: ${{ inputs.cli_config_credentials_token }}

    - name: "terraform -version"
      shell: bash
      run: terraform -version
