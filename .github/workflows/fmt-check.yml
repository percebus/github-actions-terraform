name: terraform fmt -check

on:
  workflow_call: # SRC: https://docs.github.com/en/actions/using-workflows/reusing-workflows
    inputs:
      working-directory:
        description: -chdir
        type: string
        required: false
        default: ./terra

      terraform_version:
        description: "A specific version of Terraform CLI can be installed"
        type: string
        required: false
        default: ""

  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab
    inputs:
      working-directory:
        description: -chdir
        type: string
        required: false
        default: ./terra

      terraform_version:
        description: "A specific version of Terraform CLI can be installed"
        type: string
        required: false
        default: ""

env:
  TF_IN_AUTOMATION: true

permissions:
  contents: read

jobs:
  fmt-check:
    name: fmt -check
    runs-on: ubuntu-latest
    env:
      TF_CLI_ARGS_init: ${{ inputs.TF_CLI_ARGS_init }}
    steps:
      - uses: percebus/github-actions-common/.github/actions/checkout@main
        # with: TODO

      - uses: percebus/github-actions-terraform/.github/actions/setup@main
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - uses: percebus/github-actions-terraform/.github/actions/fmt-check@main
        with:
          working-directory: ${{ inputs.working-directory }}
